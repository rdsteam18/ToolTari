<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ToolTari Blog - Free Tools Guides & Tutorials</title>
  <meta name="description" content="Read helpful guides and tutorials about PDF and image tools. Learn how to compress PDF, reduce image size, merge files, and more. Expert tips and tricks.">
  <meta name="keywords" content="tooltari blog, pdf tools guide, image tools tutorial, compress pdf guide, merge pdf tutorial, online tools help">
  <meta name="author" content="ToolTari">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:title" content="ToolTari Blog - Free Tools Guides">
  <meta property="og:description" content="Learn how to use free online PDF and image tools effectively. Step-by-step guides and tutorials.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tooltari.in/blog/">
  
  <!-- Canonical -->
  <link rel="canonical" href="https://tooltari.in/blog/">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .blog-hero {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 3rem 0 2rem;
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }
    .blog-hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.75rem; }
    .blog-hero p { font-size: 1rem; opacity: 0.95; max-width: 600px; margin: 0 auto; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    
    /* Filter Buttons */
    .filter-section {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid #e5e7eb;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .filter-btn:hover {
      border-color: #667eea;
      background: #f3f4f6;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: transparent;
    }
    
    /* Featured Section */
    .featured-section { margin-bottom: 3rem; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e5e7eb;
    }
    .section-header i { font-size: 1.3rem; color: #f59e0b; }
    .section-header h2 { font-size: 1.3rem; margin: 0; }
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .featured-card {
      background: linear-gradient(135deg, #f8fafc, #ffffff);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #e5e7eb;
      position: relative;
      transition: all 0.3s ease;
    }
    .featured-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .featured-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: #f59e0b;
      color: white;
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
    }
    
    /* Blog Grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    .blog-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      border: 1px solid #e5e7eb;
    }
    .blog-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .blog-category {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.25rem 0.75rem;
      border-radius: 2rem;
      margin-bottom: 1rem;
    }
    .blog-card h3 { font-size: 1.2rem; margin-bottom: 0.75rem; color: #1e293b; line-height: 1.4; }
    .blog-card p { color: #6b7280; line-height: 1.5; margin-bottom: 1rem; font-size: 0.9rem; }
    .blog-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .blog-meta i { margin-right: 0.25rem; }
    .read-more {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    .read-more:hover { gap: 0.75rem; }
    
    /* Loading & Error */
    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-message {
      text-align: center;
      padding: 3rem;
      color: #dc2626;
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
      grid-column: 1 / -1;
    }
    .results-count {
      text-align: center;
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }
    
    /* Ad Sections */
    .tool-ad { margin: 2rem 0; padding: 1rem; background: #f3f4f6; border-radius: 16px; text-align: center; }
    .ad-label { font-size: 0.7rem; color: #6b7280; margin-bottom: 0.5rem; text-transform: uppercase; }
    .ad-content { min-height: 90px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 12px; border: 1px dashed #d1d5db; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1.5rem; }
    
    @media (max-width: 768px) {
      .blog-hero h1 { font-size: 1.6rem; }
      .blog-grid, .featured-grid { grid-template-columns: 1fr; }
      .filter-section { gap: 0.3rem; }
      .filter-btn { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="blog-hero">
  <div class="container">
    <h1><i class="fas fa-blog"></i> Blog & Guides</h1>
    <p>Learn how to use free online tools effectively with our expert guides</p>
  </div>
</div>

<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> All tools work in your browser. Your files are never uploaded.</div>
  
  <!-- Top Ad -->
  <div class="tool-ad">
    <div class="ad-label">Advertisement</div>
    <div class="ad-content"><div style="text-align:center;padding:1rem;"><i class="fas fa-ad"></i> Google AdSense Ad</div></div>
  </div>

  <!-- Filter Buttons -->
  <div class="filter-section">
    <button class="filter-btn active" data-category="all">📚 All Posts</button>
    <button class="filter-btn" data-category="pdf">📄 PDF Guides</button>
    <button class="filter-btn" data-category="image">🖼️ Image Guides</button>
    <button class="filter-btn" data-category="utility">⚙️ Utility Guides</button>
    <button class="filter-btn" data-category="security">🔐 Security Guides</button>
    <button class="filter-btn" data-category="general">📰 General</button>
  </div>

  <!-- Results Count -->
  <div id="resultsCount" class="results-count" style="display: none;"></div>

  <!-- Loading Indicator -->
  <div id="loadingIndicator" class="loading-indicator">
    <div class="spinner"></div>
    <p>Loading articles...</p>
  </div>

  <!-- Error Message -->
  <div id="errorMessage" class="error-message" style="display: none;"></div>

  <!-- Blog Container -->
  <div id="blogContainer" style="display: none;"></div>

  <!-- Bottom Ad -->
  <div class="tool-ad">
    <div class="ad-label">Advertisement</div>
    <div class="ad-content"><div style="text-align:center;padding:1rem;"><i class="fas fa-ad"></i> Google AdSense Ad</div></div>
  </div>
</div>

<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/blog.js" defer></script>
</body>
</html>
