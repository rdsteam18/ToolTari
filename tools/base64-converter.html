<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Converter - Encode/Decode Text | ToolTari</title>
  <meta name="description" content="Convert text to Base64 and decode Base64 to text online free. Fast, secure, browser-based encoding/decoding.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/utility-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
    .tool-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    textarea { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 12px; font-family: monospace; resize: vertical; min-height: 150px; }
    .btn-group { display: flex; gap: 0.5rem; margin: 1rem 0; justify-content: center; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Base64 Converter</h1><p>Encode text to Base64 or decode Base64 to text</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> All conversions happen locally</div>
  <div class="tool-card">
    <textarea id="inputText" placeholder="Enter text to encode or Base64 to decode..."></textarea>
    <div class="btn-group">
      <button class="btn btn-primary" id="encodeBtn">Encode to Base64</button>
      <button class="btn btn-primary" id="decodeBtn">Decode from Base64</button>
    </div>
    <textarea id="outputText" placeholder="Result will appear here..." readonly style="background: #f9fafb;"></textarea>
    <div class="btn-group"><button class="btn" id="copyBtn">Copy Result</button><button id="clearBtn" class="btn">Clear</button></div>
  </div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
const input = document.getElementById('inputText');
const output = document.getElementById('outputText');
document.getElementById('encodeBtn').onclick = () => { output.value = ToolTariUtils.base64Encode(input.value); };
document.getElementById('decodeBtn').onclick = () => { try { output.value = ToolTariUtils.base64Decode(input.value); } catch(e) { output.value = 'Invalid Base64 string'; } };
document.getElementById('copyBtn').onclick = () => { output.select(); document.execCommand('copy'); alert('Copied!'); };
document.getElementById('clearBtn').onclick = () => { input.value = ''; output.value = ''; };
</script>
</body>
</html>
