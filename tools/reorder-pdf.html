<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reorder PDF Pages - Drag & Drop | ToolTari</title>
  <meta name="description" content="Reorder PDF pages online for free. Drag and drop to rearrange pages in your PDF document. No login required.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/assets/js/pdf-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .pages-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; }
    .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; max-height: 500px; overflow-y: auto; padding: 0.5rem; }
    .page-card { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 12px; padding: 0.75rem; text-align: center; cursor: grab; }
    .drag-handle { cursor: grab; margin-bottom: 0.5rem; color: #6b7280; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 500; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    @media (max-width: 768px) { .pages-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Reorder PDF Pages</h1><p>Drag and drop to rearrange pages in your PDF document</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser. Your files are never uploaded.</div>
  <div class="upload-card"><div class="dropzone" id="dropzone"><i class="fas fa-cloud-upload-alt"></i><p>Click or drag PDF here</p><input type="file" id="fileInput" accept=".pdf" style="display:none"></div><div id="fileInfo" style="display:none; margin-top:1rem"></div></div>
  <div class="controls-card" id="controls" style="display:none"><button class="btn btn-primary" id="applyBtn"><i class="fas fa-save"></i> Apply & Download</button></div>
  <div class="pages-card" id="pagesContainer" style="display:none"><h3>Pages <span id="pageCount"></span></h3><div id="pagesGrid" class="pages-grid"></div></div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
let engine, uiManager;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor = '#4F46E5'; };
dropzone.ondragleave = () => dropzone.style.borderColor = '#ccc';
dropzone.ondrop = async e => { e.preventDefault(); dropzone.style.borderColor = '#ccc'; if(e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadPDF(e.target.files[0]); };
async function loadPDF(file) {
  engine = new ToolTariPDFEngine.PDFEngine(); await engine.init(); await engine.loadPDF(file);
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-file-pdf"></i> ${file.name} (${(file.size/1024/1024).toFixed(2)} MB, ${engine.pageCount} pages) <button id="removeBtn" class="btn" style="background:#fee2e2;color:#ef4444;margin-left:1rem">Remove</button>`;
  document.getElementById('fileInfo').style.display = 'flex'; document.getElementById('controls').style.display = 'block'; document.getElementById('pagesContainer').style.display = 'block';
  document.getElementById('pageCount').innerHTML = `(${engine.pageCount} pages)`;
  uiManager = new ToolTariPDFEngine.PDFPageUIManager('pagesGrid', engine);
  await uiManager.renderPages(); uiManager.initSortable();
  document.getElementById('removeBtn').onclick = () => location.reload();
}
document.getElementById('applyBtn').onclick = async () => { const blob = await engine.rebuildPDF(); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `reordered_${Date.now()}.pdf`; a.click(); URL.revokeObjectURL(url); alert('PDF downloaded!'); };
</script>
</body>
</html>
