<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resize Image Online Free - Change Image Dimensions | ToolTari</title>
  <meta name="description" content="Resize JPG, PNG, WebP images online for free. Change image dimensions, maintain aspect ratio. No login required. 100% browser-based.">
  <meta name="keywords" content="resize image, change image size, image dimensions, resize photo online">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/image-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .preview-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; transition: all 0.2s; }
    .dropzone.drag-over { border-color: #4F46E5; background: rgba(79,70,229,0.05); }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .preview-box { text-align: center; }
    .preview-box canvas { max-width: 100%; height: auto; max-height: 300px; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; }
    .size-info { margin-top: 0.5rem; font-size: 0.85rem; color: #6b7280; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 500; margin: 0.25rem; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
    input { padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; width: 120px; margin: 0 0.5rem; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    .dimension-input { display: inline-flex; align-items: center; margin: 0.5rem; }
    @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } .dimension-input { display: flex; margin: 0.5rem 0; } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Resize Image Online Free</h1><p>Change image dimensions to any size you need. Maintain aspect ratio option.</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser. Your images are never uploaded.</div>
  
  <div class="upload-card">
    <div class="dropzone" id="dropzone">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>Drag & drop image here or click to browse</p>
      <p class="small">Supports JPG, PNG, WebP (Max 20MB)</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none">
    </div>
    <div id="fileInfo" style="display:none; margin-top:1rem"></div>
  </div>
  
  <div class="controls-card" id="controls" style="display:none">
    <div class="dimension-input"><label>Width: <input type="number" id="width" placeholder="Width" step="1"></label></div>
    <div class="dimension-input"><label>Height: <input type="number" id="height" placeholder="Height" step="1"></label></div>
    <div class="dimension-input"><label><input type="checkbox" id="maintainAspect" checked> Maintain aspect ratio</label></div>
    <div><button class="btn btn-primary" id="applyBtn">Apply Resize</button>
    <button class="btn btn-primary" id="downloadBtn">Download Image</button>
    <button id="resetBtn" class="btn">Reset</button></div>
  </div>
  
  <div class="preview-card" id="preview" style="display:none">
    <div class="preview-grid">
      <div class="preview-box"><h3>Original</h3><canvas id="originalCanvas"></canvas><div id="originalSize" class="size-info"></div></div>
      <div class="preview-box"><h3>Resized</h3><canvas id="processedCanvas"></canvas><div id="resizedSize" class="size-info"></div></div>
    </div>
  </div>
</div>

<script src="/assets/js/ui.js" defer></script>
<script>
let engine, uiManager;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('drag-over'); };
dropzone.ondragleave = () => dropzone.classList.remove('drag-over');
dropzone.ondrop = async e => { e.preventDefault(); dropzone.classList.remove('drag-over'); if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadImage(e.target.files[0]); };

async function loadImage(file) {
  engine = new ToolTariImageEngine.ImageEngine();
  await engine.loadImage(file);
  uiManager = new ToolTariImageEngine.ImageUIManager('originalCanvas', 'processedCanvas', engine);
  uiManager.updateDisplays();
  uiManager.fitCanvasesToContainer('preview');
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-image"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB) <button onclick="location.reload()" style="background:#fee2e2;color:#ef4444;padding:0.3rem 0.8rem;border-radius:2rem;border:none">Remove</button>`;
  document.getElementById('controls').style.display = 'block';
  document.getElementById('preview').style.display = 'block';
  document.getElementById('originalSize').innerHTML = `Size: ${(file.size/1024).toFixed(1)} KB<br>Dimensions: ${engine.originalImage.width} x ${engine.originalImage.height}px`;
  document.getElementById('width').value = engine.originalImage.width;
  document.getElementById('height').value = engine.originalImage.height;
  updateResizedInfo();
}

async function updateResizedInfo() {
  const blob = await engine.getProcessedBlob();
  if(blob) document.getElementById('resizedSize').innerHTML = `Size: ${(blob.size/1024).toFixed(1)} KB<br>Dimensions: ${engine.processedCanvas.width} x ${engine.processedCanvas.height}px`;
}

document.getElementById('applyBtn').onclick = () => {
  let w = parseInt(document.getElementById('width').value);
  let h = parseInt(document.getElementById('height').value);
  const maintain = document.getElementById('maintainAspect').checked;
  if(maintain) {
    if(w && !h) h = Math.round(w / (engine.originalImage.width / engine.originalImage.height));
    else if(!w && h) w = Math.round(h * (engine.originalImage.width / engine.originalImage.height));
  }
  engine.resize(w, h, maintain);
  uiManager.updateDisplays();
  uiManager.fitCanvasesToContainer('preview');
  updateResizedInfo();
};
document.getElementById('downloadBtn').onclick = () => engine.downloadImage();
document.getElementById('resetBtn').onclick = () => { engine.reset(); uiManager.updateDisplays(); document.getElementById('width').value = engine.originalImage.width; document.getElementById('height').value = engine.originalImage.height; updateResizedInfo(); };
</script>
</body>
</html>
