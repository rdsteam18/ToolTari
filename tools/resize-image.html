<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resize Image Online Free - Change Image Dimensions | ToolTari</title>
  <meta name="description" content="Resize JPG, PNG, WebP images online for free. Change image dimensions, maintain aspect ratio. No login required.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/image-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .preview-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .preview-box { text-align: center; }
    .preview-box canvas { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #e5e7eb; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; margin: 0.25rem; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    input { padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; width: 100px; margin: 0 0.5rem; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Resize Image Online Free</h1><p>Change image dimensions to any size you need</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser.</div>
  <div class="upload-card"><div class="dropzone" id="dropzone"><i class="fas fa-cloud-upload-alt"></i><p>Click or drag image here</p><input type="file" id="fileInput" accept="image/*" style="display:none"></div><div id="fileInfo" style="display:none"></div></div>
  <div class="controls-card" id="controls" style="display:none"><label>Width: <input type="number" id="width" placeholder="Width"></label><label>Height: <input type="number" id="height" placeholder="Height"></label><label><input type="checkbox" id="maintainAspect" checked> Maintain aspect ratio</label><br><button class="btn btn-primary" id="applyBtn">Apply Resize</button><button class="btn btn-primary" id="downloadBtn">Download</button><button id="resetBtn" class="btn">Reset</button></div>
  <div class="preview-card" id="preview" style="display:none"><div class="preview-grid"><div class="preview-box"><h3>Original</h3><canvas id="originalCanvas"></canvas></div><div class="preview-box"><h3>Resized</h3><canvas id="processedCanvas"></canvas></div></div></div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
let engine, uiManager;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondrop = async e => { e.preventDefault(); if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadImage(e.target.files[0]); };
async function loadImage(file) {
  engine = new ToolTariImageEngine.ImageEngine(); await engine.loadImage(file);
  uiManager = new ToolTariImageEngine.ImageUIManager('originalCanvas', 'processedCanvas', engine);
  uiManager.updateDisplays(); uiManager.fitCanvasesToContainer('preview');
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-image"></i> ${file.name} <button onclick="location.reload()">Remove</button>`;
  document.getElementById('controls').style.display = 'block'; document.getElementById('preview').style.display = 'block';
  document.getElementById('width').value = engine.originalImage.width;
  document.getElementById('height').value = engine.originalImage.height;
}
document.getElementById('applyBtn').onclick = () => {
  let w = parseInt(document.getElementById('width').value);
  let h = parseInt(document.getElementById('height').value);
  const maintain = document.getElementById('maintainAspect').checked;
  if(maintain) { if(w && !h) h = Math.round(w / (engine.originalImage.width / engine.originalImage.height));
    else if(!w && h) w = Math.round(h * (engine.originalImage.width / engine.originalImage.height)); }
  engine.resize(w, h, maintain);
  uiManager.updateDisplays(); uiManager.fitCanvasesToContainer('preview');
};
document.getElementById('downloadBtn').onclick = () => engine.downloadImage();
document.getElementById('resetBtn').onclick = () => { engine.reset(); uiManager.updateDisplays(); document.getElementById('width').value = engine.originalImage.width; document.getElementById('height').value = engine.originalImage.height; };
</script>
</body>
</html>
