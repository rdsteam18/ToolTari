<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Converter - UPPERCASE, lowercase, Title Case | ToolTari</title>
  <meta name="description" content="Convert text case online free. UPPERCASE, lowercase, Title Case, Sentence case, Inverse case. No login required.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/utility-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
    .tool-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    textarea { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 150px; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; justify-content: center; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; background: #f3f4f6; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .btn:hover { transform: translateY(-2px); }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Text Converter</h1><p>Convert text to UPPERCASE, lowercase, Title Case, and more</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> Your text never leaves your browser</div>
  <div class="tool-card">
    <textarea id="inputText" placeholder="Enter your text here..."></textarea>
    <div class="btn-group">
      <button class="btn" data-case="upper">UPPERCASE</button>
      <button class="btn" data-case="lower">lowercase</button>
      <button class="btn" data-case="title">Title Case</button>
      <button class="btn" data-case="sentence">Sentence case</button>
      <button class="btn" data-case="inverse">InVERsE cASE</button>
    </div>
    <textarea id="outputText" placeholder="Converted text will appear here..." readonly style="background: #f9fafb;"></textarea>
    <div class="btn-group"><button class="btn btn-primary" id="copyBtn">Copy Result</button><button id="swapBtn" class="btn">Swap ↔</button><button id="clearBtn" class="btn">Clear All</button></div>
  </div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
const input = document.getElementById('inputText');
const output = document.getElementById('outputText');

document.querySelectorAll('[data-case]').forEach(btn => {
  btn.onclick = () => {
    const result = ToolTariUtils.convertCase(input.value, btn.dataset.case);
    output.value = result;
  };
});
document.getElementById('copyBtn').onclick = () => { output.select(); document.execCommand('copy'); alert('Copied!'); };
document.getElementById('swapBtn').onclick = () => { const temp = input.value; input.value = output.value; output.value = temp; };
document.getElementById('clearBtn').onclick = () => { input.value = ''; output.value = ''; };
</script>
</body>
</html>
