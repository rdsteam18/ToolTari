<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Protect PDF with Password | ToolTari</title>
<meta name="description" content="Add password protection to PDF online for free. Secure your PDF documents.">
<link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="/assets/js/pdf-engine.js"></script>
<style>
.tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
.container { max-width: 600px; margin: 0 auto; padding: 0 1.5rem; }
.upload-card, .options-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
.dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; }
.btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
.trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
input { padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; width: 100%; margin: 0.5rem 0; }
</style></head>
<body>
<div class="tool-hero"><div class="container"><h1>Protect PDF</h1><p>Add password protection to your PDF</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser.</div>
  <div class="upload-card"><div class="dropzone" id="dropzone"><i class="fas fa-cloud-upload-alt"></i><p>Click or drag PDF here</p><input type="file" id="fileInput" accept=".pdf" style="display:none"></div><div id="fileInfo" style="display:none"></div></div>
  <div class="options-card" id="options" style="display:none"><h3>Set Password</h3><input type="password" id="password" placeholder="Enter password"><input type="password" id="confirmPassword" placeholder="Confirm password"><button class="btn btn-primary" id="applyBtn">Protect & Download</button></div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
let engine;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondrop = async e => { e.preventDefault(); if(e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadPDF(e.target.files[0]); };
async function loadPDF(file) {
  engine = new ToolTariPDFEngine.PDFEngine(); await engine.init(); await engine.loadPDF(file);
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-file-pdf"></i> ${file.name} <button onclick="location.reload()">Remove</button>`;
  document.getElementById('options').style.display = 'block';
}
document.getElementById('applyBtn').onclick = async () => {
  const pwd = document.getElementById('password').value;
  if(!pwd) return alert('Enter password'); if(pwd !== document.getElementById('confirmPassword').value) return alert('Passwords do not match');
  await engine.protectPDF(pwd); const blob = await engine.rebuildPDF();
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `protected_${Date.now()}.pdf`; a.click(); URL.revokeObjectURL(url);
};
</script>
</body>
</html>
