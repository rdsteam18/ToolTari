<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Renamer Online Free - Rename Any File | ToolTari</title>
  <meta name="description" content="Rename any file online for free. Change file names without downloading software. No login required. 100% browser-based.">
  <meta name="keywords" content="file renamer, rename file online, batch file rename, change file name">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .preview-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; transition: all 0.2s; }
    .dropzone.drag-over { border-color: #4F46E5; background: rgba(79,70,229,0.05); }
    .file-list { list-style: none; max-height: 400px; overflow-y: auto; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #e5e7eb; gap: 1rem; flex-wrap: wrap; }
    .file-info { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 200px; }
    .file-info i { font-size: 1.5rem; color: #4F46E5; }
    .file-details { display: flex; flex-direction: column; }
    .old-name { font-size: 0.85rem; color: #6b7280; word-break: break-all; }
    .new-name-input { flex: 1; min-width: 200px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; }
    .rename-btn { background: #4F46E5; color: white; border: none; padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; transition: all 0.2s; }
    .rename-btn:hover { background: #4338ca; transform: translateY(-2px); }
    .download-all-btn { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 2rem; cursor: pointer; font-weight: 500; margin-top: 1rem; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 500; margin: 0.25rem; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    .rename-options { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #e5e7eb; }
    .batch-input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; flex: 1; }
    @media (max-width: 768px) { .file-item { flex-direction: column; align-items: stretch; } .new-name-input { width: 100%; } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>File Renamer</h1><p>Rename any file online - Change file names without downloading software</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser. Your files are never uploaded.</div>
  
  <div class="upload-card">
    <div class="dropzone" id="dropzone">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>Drag & drop files here or click to browse</p>
      <p class="small">Any file type supported (Max 10 files at once)</p>
      <input type="file" id="fileInput" multiple style="display:none">
    </div>
    <div id="fileInfo" style="display:none; margin-top:1rem"></div>
  </div>
  
  <div class="controls-card" id="controls" style="display:none">
    <div class="rename-options">
      <input type="text" id="prefixInput" class="batch-input" placeholder="Prefix (e.g., 'myphoto_')">
      <input type="text" id="suffixInput" class="batch-input" placeholder="Suffix (e.g., '_edited')">
      <input type="text" id="replaceInput" class="batch-input" placeholder="Replace text">
      <input type="text" id="withInput" class="batch-input" placeholder="With text">
      <button id="applyBatchBtn" class="btn btn-primary">Apply to All</button>
    </div>
    <div id="fileList" class="file-list"></div>
    <div style="text-align: center;"><button id="downloadAllBtn" class="download-all-btn"><i class="fas fa-download"></i> Download All Renamed Files</button></div>
  </div>
</div>

<script src="/assets/js/ui.js" defer></script>
<script>
let files = [];
let renamedFiles = [];

const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('drag-over'); };
dropzone.ondragleave = () => dropzone.classList.remove('drag-over');
dropzone.ondrop = e => { e.preventDefault(); dropzone.classList.remove('drag-over'); if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); };
fileInput.onchange = e => { if(e.target.files.length) loadFiles(e.target.files); };

function loadFiles(fileList) {
  files = Array.from(fileList).slice(0, 10);
  renamedFiles = files.map(f => ({ original: f, newName: f.name }));
  renderFileList();
  document.getElementById('controls').style.display = 'block';
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-check-circle"></i> ${files.length} file(s) loaded`;
}

function renderFileList() {
  const container = document.getElementById('fileList');
  container.innerHTML = renamedFiles.map((item, idx) => `
    <div class="file-item" data-index="${idx}">
      <div class="file-info">
        <i class="fas fa-file"></i>
        <div class="file-details">
          <strong>${escapeHtml(item.newName)}</strong>
          <span class="old-name">Original: ${escapeHtml(item.original.name)}</span>
        </div>
      </div>
      <input type="text" class="new-name-input" value="${escapeHtml(item.newName)}" data-index="${idx}">
      <button class="rename-btn" data-index="${idx}">Rename</button>
    </div>
  `).join('');
  
  document.querySelectorAll('.new-name-input').forEach(input => {
    input.onchange = (e) => {
      const idx = parseInt(input.dataset.index);
      renamedFiles[idx].newName = input.value;
    };
  });
  
  document.querySelectorAll('.rename-btn').forEach(btn => {
    btn.onclick = (e) => {
      const idx = parseInt(btn.dataset.index);
      const input = document.querySelector(`.new-name-input[data-index="${idx}"]`);
      renamedFiles[idx].newName = input.value;
      renderFileList();
    };
  });
}

document.getElementById('applyBatchBtn').onclick = () => {
  const prefix = document.getElementById('prefixInput').value;
  const suffix = document.getElementById('suffixInput').value;
  const replace = document.getElementById('replaceInput').value;
  const replaceWith = document.getElementById('withInput').value;
  
  renamedFiles = renamedFiles.map(item => {
    let newName = item.original.name;
    if(prefix) newName = prefix + newName;
    if(suffix) {
      const dotIndex = newName.lastIndexOf('.');
      if(dotIndex > -1) newName = newName.slice(0, dotIndex) + suffix + newName.slice(dotIndex);
      else newName += suffix;
    }
    if(replace) newName = newName.replace(new RegExp(replace, 'g'), replaceWith);
    return { ...item, newName };
  });
  renderFileList();
};

document.getElementById('downloadAllBtn').onclick = async () => {
  for(let i = 0; i < renamedFiles.length; i++) {
    const item = renamedFiles[i];
    const blob = await item.original.slice(0, item.original.size, item.original.type);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = item.newName;
    a.click();
    URL.revokeObjectURL(url);
    await new Promise(r => setTimeout(r, 100));
  }
  alert(`Downloaded ${renamedFiles.length} file(s)`);
};

function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'; }); }
</script>
</body>
</html>
