<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Add Page Numbers to PDF | ToolTari</title>
<meta name="description" content="Add page numbers to PDF online for free. Customize position and numbering style.">
<link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="/assets/js/pdf-engine.js"></script>
<style>
.tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
.container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
.upload-card, .options-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
.dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; }
.btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
.trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
select, input { padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; margin: 0 0.5rem; }
</style></head>
<body>
<div class="tool-hero"><div class="container"><h1>Add Page Numbers to PDF</h1><p>Add page numbers to your PDF document</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser.</div>
  <div class="upload-card"><div class="dropzone" id="dropzone"><i class="fas fa-cloud-upload-alt"></i><p>Click or drag PDF here</p><input type="file" id="fileInput" accept=".pdf" style="display:none"></div><div id="fileInfo" style="display:none; margin-top:1rem"></div></div>
  <div class="options-card" id="options" style="display:none"><h3>Numbering Options</h3><label>Position: <select id="position"><option value="bottom-center">Bottom Center</option><option value="bottom-right">Bottom Right</option><option value="bottom-left">Bottom Left</option></select></label><label>Start from: <input type="number" id="startFrom" value="1" min="1"></label><br><br><button class="btn btn-primary" id="applyBtn"><i class="fas fa-save"></i> Add Numbers & Download</button></div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
let engine;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondrop = async e => { e.preventDefault(); if(e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadPDF(e.target.files[0]); };
async function loadPDF(file) {
  engine = new ToolTariPDFEngine.PDFEngine(); await engine.init(); await engine.loadPDF(file);
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-file-pdf"></i> ${file.name} <button onclick="location.reload()" style="background:#fee2e2;color:#ef4444;">Remove</button>`;
  document.getElementById('options').style.display = 'block';
}
document.getElementById('applyBtn').onclick = async () => {
  await engine.addPageNumbers(document.getElementById('position').value, parseInt(document.getElementById('startFrom').value));
  const blob = await engine.rebuildPDF();
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `numbered_${Date.now()}.pdf`; a.click(); URL.revokeObjectURL(url);
};
</script>
</body>
</html>
