<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Converter - HEX to RGB, RGB to HEX | ToolTari</title>
  <meta name="description" content="Convert colors between HEX and RGB formats. Pick any color and get instant conversions. Free online color converter.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/utility-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
    .tool-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .color-preview { width: 100%; height: 100px; border-radius: 12px; margin: 1rem 0; border: 2px solid #e5e7eb; }
    .input-group { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
    .input-group input { flex: 1; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px; font-family: monospace; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Color Converter</h1><p>Convert between HEX and RGB color formats</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> All conversions done locally</div>
  <div class="tool-card">
    <div class="color-preview" id="colorPreview"></div>
    <div class="input-group"><input type="text" id="hexInput" placeholder="#RRGGBB" value="#4F46E5"><button id="hexToRgbBtn" class="btn btn-primary">→ Convert to RGB</button></div>
    <div class="input-group"><input type="text" id="rgbInput" placeholder="RGB(r, g, b)"><button id="rgbToHexBtn" class="btn btn-primary">→ Convert to HEX</button></div>
    <div style="text-align: center;"><button id="randomBtn" class="btn">🎲 Random Color</button></div>
  </div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
const hexInput = document.getElementById('hexInput');
const rgbInput = document.getElementById('rgbInput');
const preview = document.getElementById('colorPreview');

function updatePreview(color) { preview.style.backgroundColor = color; }

document.getElementById('hexToRgbBtn').onclick = () => {
  const hex = hexInput.value;
  const rgb = ToolTariUtils.hexToRgb(hex);
  if(rgb) { rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`; updatePreview(hex); }
  else alert('Invalid HEX color');
};
document.getElementById('rgbToHexBtn').onclick = () => {
  const match = rgbInput.value.match(/\d+/g);
  if(match && match.length >= 3) {
    const hex = ToolTariUtils.rgbToHex(parseInt(match[0]), parseInt(match[1]), parseInt(match[2]));
    hexInput.value = hex; updatePreview(hex);
  } else alert('Invalid RGB format. Use: rgb(255, 99, 71)');
};
document.getElementById('randomBtn').onclick = () => {
  const hex = ToolTariUtils.randomColor();
  hexInput.value = hex;
  const rgb = ToolTariUtils.hexToRgb(hex);
  if(rgb) rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
  updatePreview(hex);
};
updatePreview('#4F46E5');
</script>
</body>
</html>
