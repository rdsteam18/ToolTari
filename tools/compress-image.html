<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compress Image Online Free - Reduce Image Size | ToolTari</title>
  <meta name="description" content="Compress JPG, PNG, WebP images online for free. Reduce image file size while maintaining quality. No login required.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/image-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .preview-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .preview-box { text-align: center; }
    .preview-box canvas { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; }
    .size-info { margin-top: 0.5rem; font-size: 0.85rem; color: #6b7280; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 500; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    input[type="range"] { width: 100%; margin: 1rem 0; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Compress Image Online Free</h1><p>Reduce image file size without losing quality</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser. Your images are never uploaded.</div>
  <div class="upload-card"><div class="dropzone" id="dropzone"><i class="fas fa-cloud-upload-alt"></i><p>Click or drag image here (JPG, PNG, WebP)</p><input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none"></div><div id="fileInfo" style="display:none; margin-top:1rem"></div></div>
  <div class="controls-card" id="controls" style="display:none"><label>Compression Quality: <span id="qualityValue">70</span>%</label><input type="range" id="quality" min="10" max="100" value="70"><button class="btn btn-primary" id="downloadBtn"><i class="fas fa-download"></i> Download Compressed Image</button></div>
  <div class="preview-card" id="preview" style="display:none"><div class="preview-grid"><div class="preview-box"><h3>Original</h3><canvas id="originalCanvas"></canvas><div id="originalSize" class="size-info"></div></div><div class="preview-box"><h3>Compressed</h3><canvas id="processedCanvas"></canvas><div id="compressedSize" class="size-info"></div></div></div></div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
let engine, uiManager;
const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor = '#4F46E5'; };
dropzone.ondragleave = () => dropzone.style.borderColor = '#ccc';
dropzone.ondrop = async e => { e.preventDefault(); dropzone.style.borderColor = '#ccc'; if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadImage(e.target.files[0]); };
async function loadImage(file) {
  engine = new ToolTariImageEngine.ImageEngine();
  await engine.loadImage(file);
  uiManager = new ToolTariImageEngine.ImageUIManager('originalCanvas', 'processedCanvas', engine);
  uiManager.updateDisplays();
  uiManager.fitCanvasesToContainer('preview');
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-image"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB) <button onclick="location.reload()" style="background:#fee2e2;color:#ef4444;">Remove</button>`;
  document.getElementById('controls').style.display = 'block';
  document.getElementById('preview').style.display = 'block';
  document.getElementById('originalSize').innerHTML = `Size: ${(file.size/1024).toFixed(1)} KB`;
  updatePreview();
}
document.getElementById('quality').oninput = (e) => { document.getElementById('qualityValue').innerText = e.target.value; updatePreview(); };
async function updatePreview() {
  const quality = document.getElementById('quality').value / 100;
  const blob = await engine.getProcessedBlob('image/jpeg', quality);
  if(blob) document.getElementById('compressedSize').innerHTML = `Size: ${(blob.size/1024).toFixed(1)} KB (${Math.round((1 - blob.size/engine.originalFile.size)*100)}% smaller)`;
}
document.getElementById('downloadBtn').onclick = async () => {
  const quality = document.getElementById('quality').value / 100;
  await engine.downloadImage('image/jpeg', quality);
};
</script>
</body>
</html>
