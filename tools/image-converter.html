<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter - Convert JPG to PNG, PNG to JPG | ToolTari</title>
  <meta name="description" content="Convert images between JPG, PNG, and WebP formats online for free. No login required. 100% browser-based.">
  <meta name="keywords" content="image converter, jpg to png, png to jpg, webp converter, convert image format">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/image-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .upload-card, .controls-card, .preview-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; background: #f9fafb; transition: all 0.2s; }
    .dropzone.drag-over { border-color: #4F46E5; background: rgba(79,70,229,0.05); }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .preview-box { text-align: center; }
    .preview-box canvas { max-width: 100%; height: auto; max-height: 300px; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; }
    .size-info { margin-top: 0.5rem; font-size: 0.85rem; color: #6b7280; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 500; margin: 0.25rem; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
    .format-select { padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid #ccc; margin: 0 0.5rem; font-size: 1rem; }
    .quality-slider { width: 200px; margin: 0 0.5rem; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
    @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Image Converter</h1><p>Convert images between JPG, PNG, and WebP formats</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> 🔒 All processing happens in your browser. Your images are never uploaded.</div>
  
  <div class="upload-card">
    <div class="dropzone" id="dropzone">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>Drag & drop image here or click to browse</p>
      <p class="small">Supports JPG, PNG, WebP (Max 20MB)</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none">
    </div>
    <div id="fileInfo" style="display:none; margin-top:1rem"></div>
  </div>
  
  <div class="controls-card" id="controls" style="display:none">
    <div style="margin: 1rem 0;">
      <label>Convert to: 
        <select id="formatSelect" class="format-select">
          <option value="image/jpeg">JPEG/JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <label id="qualityLabel" style="display:none;">Quality: <input type="range" id="quality" class="quality-slider" min="10" max="100" value="90"> <span id="qualityValue">90</span>%</label>
    </div>
    <div><button class="btn btn-primary" id="convertBtn">Convert & Preview</button>
    <button class="btn btn-primary" id="downloadBtn">Download Converted Image</button></div>
  </div>
  
  <div class="preview-card" id="preview" style="display:none">
    <div class="preview-grid">
      <div class="preview-box"><h3>Original</h3><canvas id="originalCanvas"></canvas><div id="originalSize" class="size-info"></div></div>
      <div class="preview-box"><h3>Converted</h3><canvas id="processedCanvas"></canvas><div id="convertedSize" class="size-info"></div></div>
    </div>
  </div>
</div>

<script src="/assets/js/ui.js" defer></script>
<script>
let engine, uiManager;
let convertedBlob = null;

const dropzone = document.getElementById('dropzone'), fileInput = document.getElementById('fileInput');
dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('drag-over'); };
dropzone.ondragleave = () => dropzone.classList.remove('drag-over');
dropzone.ondrop = async e => { e.preventDefault(); dropzone.classList.remove('drag-over'); if(e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if(e.target.files[0]) loadImage(e.target.files[0]); };

document.getElementById('formatSelect').onchange = () => {
  const format = document.getElementById('formatSelect').value;
  const qualityLabel = document.getElementById('qualityLabel');
  qualityLabel.style.display = format === 'image/jpeg' || format === 'image/webp' ? 'inline' : 'none';
};
document.getElementById('quality').oninput = (e) => document.getElementById('qualityValue').innerText = e.target.value;

async function loadImage(file) {
  engine = new ToolTariImageEngine.ImageEngine();
  await engine.loadImage(file);
  uiManager = new ToolTariImageEngine.ImageUIManager('originalCanvas', 'processedCanvas', engine);
  uiManager.updateDisplays();
  uiManager.fitCanvasesToContainer('preview');
  document.getElementById('fileInfo').innerHTML = `<i class="fas fa-image"></i> ${file.name} (${(file.size/1024).toFixed(1)} KB) <button onclick="location.reload()" style="background:#fee2e2;color:#ef4444;padding:0.3rem 0.8rem;border-radius:2rem;border:none">Remove</button>`;
  document.getElementById('controls').style.display = 'block';
  document.getElementById('preview').style.display = 'block';
  document.getElementById('originalSize').innerHTML = `Format: ${file.type.split('/')[1].toUpperCase()}<br>Size: ${(file.size/1024).toFixed(1)} KB<br>Dimensions: ${engine.originalImage.width} x ${engine.originalImage.height}px`;
}

document.getElementById('convertBtn').onclick = async () => {
  const format = document.getElementById('formatSelect').value;
  const quality = parseInt(document.getElementById('quality').value) / 100;
  
  convertedBlob = await engine.getProcessedBlob(format, quality);
  const url = URL.createObjectURL(convertedBlob);
  
  const img = new Image();
  img.onload = () => {
    const processedCanvas = document.getElementById('processedCanvas');
    processedCanvas.width = img.width;
    processedCanvas.height = img.height;
    const ctx = processedCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    document.getElementById('convertedSize').innerHTML = `Format: ${format.split('/')[1].toUpperCase()}<br>Size: ${(convertedBlob.size/1024).toFixed(1)} KB<br>Dimensions: ${img.width} x ${img.height}px`;
  };
  img.src = url;
};

document.getElementById('downloadBtn').onclick = async () => {
  if(!convertedBlob) {
    alert('Please convert the image first.');
    return;
  }
  const format = document.getElementById('formatSelect').value;
  const extension = format === 'image/jpeg' ? 'jpg' : format === 'image/png' ? 'png' : 'webp';
  const url = URL.createObjectURL(convertedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `converted.${extension}`;
  a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
