<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - Strong Random Password | ToolTari</title>
  <meta name="description" content="Generate strong random passwords online free. Customizable length, include uppercase, lowercase, numbers, symbols. No login required.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/utility-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
    .tool-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .password-display { font-size: 1.5rem; font-family: monospace; text-align: center; padding: 1.5rem; background: #f9fafb; border-radius: 12px; word-break: break-all; }
    .option-group { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; justify-content: center; }
    .option-group label { display: flex; align-items: center; gap: 0.5rem; }
    .strength-meter { height: 8px; background: #e5e7eb; border-radius: 4px; margin: 1rem 0; overflow: hidden; }
    .strength-fill { height: 100%; width: 0; transition: width 0.3s; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; margin: 0.25rem; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    input[type="range"] { width: 200px; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Password Generator</h1><p>Generate strong, secure random passwords</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> Passwords generated locally - never transmitted</div>
  <div class="tool-card">
    <div class="password-display" id="passwordDisplay">Click Generate</div>
    <div class="option-group"><label>Length: <input type="range" id="length" min="6" max="32" value="12"> <span id="lengthValue">12</span></label></div>
    <div class="option-group">
      <label><input type="checkbox" id="uppercase" checked> ABC (Uppercase)</label>
      <label><input type="checkbox" id="lowercase" checked> abc (Lowercase)</label>
      <label><input type="checkbox" id="numbers" checked> 123 (Numbers)</label>
      <label><input type="checkbox" id="symbols" checked> !@# (Symbols)</label>
    </div>
    <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
    <div style="text-align: center;"><button class="btn btn-primary" id="generateBtn">Generate New Password</button><button class="btn" id="copyBtn">Copy to Clipboard</button></div>
  </div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
const display = document.getElementById('passwordDisplay');
const lengthSlider = document.getElementById('length');
const lengthValue = document.getElementById('lengthValue');
const generateBtn = document.getElementById('generateBtn');
const copyBtn = document.getElementById('copyBtn');
const strengthFill = document.getElementById('strengthFill');

function generate() {
  const length = parseInt(lengthSlider.value);
  const options = {
    uppercase: document.getElementById('uppercase').checked,
    lowercase: document.getElementById('lowercase').checked,
    numbers: document.getElementById('numbers').checked,
    symbols: document.getElementById('symbols').checked
  };
  const password = ToolTariUtils.generatePassword(length, options);
  display.value = password;
  display.innerText = password;
  
  const strength = ToolTariUtils.checkPasswordStrength(password);
  strengthFill.style.width = `${(strength.score / 6) * 100}%`;
  strengthFill.style.background = strength.color;
  display.style.borderLeft = `4px solid ${strength.color}`;
}

lengthSlider.oninput = () => { lengthValue.innerText = lengthSlider.value; generate(); };
document.querySelectorAll('#uppercase, #lowercase, #numbers, #symbols').forEach(cb => cb.onchange = generate);
generateBtn.onclick = generate;
copyBtn.onclick = () => { navigator.clipboard.writeText(display.innerText); alert('Copied!'); };
generate();
</script>
</body>
</html>
