<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker - Test Your Password Security | ToolTari</title>
  <meta name="description" content="Check your password strength online free. Test how secure your password is and get suggestions to improve it.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/assets/js/utility-engine.js"></script>
  <style>
    .tool-hero { background: linear-gradient(135deg, #667eea, #764ba2); padding: 2rem 0; text-align: center; color: white; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
    .tool-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input[type="password"], input[type="text"] { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; }
    .strength-meter { height: 12px; background: #e5e7eb; border-radius: 6px; margin: 1rem 0; overflow: hidden; }
    .strength-fill { height: 100%; width: 0; transition: width 0.3s; }
    .strength-text { text-align: center; font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0; }
    .suggestions { background: #f9fafb; border-radius: 12px; padding: 1rem; margin-top: 1rem; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #4F46E5, #06B6D4); color: white; }
    .trust-message { background: #f0fdf4; padding: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="tool-hero"><div class="container"><h1>Password Strength Checker</h1><p>Test how secure your password is</p></div></div>
<div class="container">
  <div class="trust-message"><i class="fas fa-lock"></i> Your password never leaves your browser</div>
  <div class="tool-card">
    <input type="password" id="passwordInput" placeholder="Enter password to check..." autocomplete="off">
    <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-text" id="strengthText"></div>
    <div class="suggestions" id="suggestions">
      <strong>💡 Password Tips:</strong><br>
      • Use at least 8 characters<br>
      • Include uppercase and lowercase letters<br>
      • Add numbers and special characters<br>
      • Avoid common words or personal info
    </div>
    <div style="text-align: center; margin-top: 1rem;"><button class="btn" id="toggleView">👁️ Show/Hide Password</button></div>
  </div>
</div>
<script src="/assets/js/ui.js" defer></script>
<script>
const passwordInput = document.getElementById('passwordInput');
const strengthFill = document.getElementById('strengthFill');
const strengthText = document.getElementById('strengthText');
let isText = false;

function checkStrength() {
  const password = passwordInput.value;
  const result = ToolTariUtils.checkPasswordStrength(password);
  strengthFill.style.width = `${(result.score / 6) * 100}%`;
  strengthFill.style.background = result.color;
  strengthText.innerHTML = `<i class="fas fa-shield-alt"></i> Password Strength: ${result.strength}`;
  strengthText.style.color = result.color;
}
passwordInput.oninput = checkStrength;
document.getElementById('toggleView').onclick = () => {
  isText = !isText;
  passwordInput.type = isText ? 'text' : 'password';
};
checkStrength();
</script>
</body>
</html>
