    javascript: `// JavaScript Console Playground
// Write your code here and see the output in the console below

## Features

## Lists

// Initialize Monaco Editor
require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});

window.addEventListener('load', () => {
    require(['vs/editor/editor.main'], function() {
        initEditor();
        loadSnippets();
        setupEventListeners();
        setupMessageListener();
        
        // Check for saved draft
        const savedDraft = localStorage.getItem('codeEditor_draft');
        if (savedDraft) {
            try {
                const draft = JSON.parse(savedDraft);
                if (draft.language && draft.code) {
                    document.getElementById('languageSelect').value = draft.language;
                    changeLanguage(draft.language, false);
                    editor.setValue(draft.code);
                }
            } catch (e) {
                console.error('Error loading draft:', e);
            }
        }
        
        // Start auto-save
        autoSaveInterval = setInterval(autoSave, 30000);
    });
});

function initEditor() {
    const isDark = document.documentElement.classList.contains('dark');
    
    editor = monaco.editor.create(document.getElementById('monacoEditor'), {
        value: defaultTemplates.html,
        language: 'html',
        theme: isDark ? 'vs-dark' : 'vs',
        automaticLayout: true,
        fontSize: 14,
        fontFamily: 'JetBrains Mono, Consolas, Monaco, monospace',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        roundedSelection: false,
        padding: { top: 16 },
        lineNumbers: 'on',
        renderLineHighlight: 'all',
        quickSuggestions: true,
        suggestOnTriggerCharacters: true,
        wordBasedSuggestions: true,
        parameterHints: { enabled: true },
        autoIndent: 'full',
        formatOnPaste: true,
        formatOnType: true
    });

    // Update cursor position
    editor.onDidChangeCursorPosition((e) => {
        document.getElementById('cursorPosition').textContent = 
            `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
    });
}

function setupEventListeners() {
    // Language Selector
    document.getElementById('languageSelect').addEventListener('change', (e) => {
        changeLanguage(e.target.value, true);
    });

    // Theme Toggle
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // Run Button
    document.getElementById('runBtn').addEventListener('click', runCode);

    // Reset Button
    document.getElementById('resetBtn').addEventListener('click', resetCode);

    // Save Button
    document.getElementById('saveBtn').addEventListener('click', saveSnippet);

    // Download Button
    document.getElementById('downloadBtn').addEventListener('click', downloadCode);

    // Refresh Preview
    document.getElementById('refreshPreview').addEventListener('click', runCode);

    // Open in New Tab
    document.getElementById('openNewTab').addEventListener('click', openInNewTab);

    // Clear Console
    document.getElementById('clearConsole').addEventListener('click', clearConsole);

    // Handle before unload
    window.addEventListener('beforeunload', () => {
        autoSave();
        clearInterval(autoSaveInterval);
    });
}

function changeLanguage(lang, resetContent = false) {
    currentLanguage = lang;
    
    // Update Monaco language
    const model = editor.getModel();
    monaco.editor.setModelLanguage(model, lang === 'markdown' ? 'markdown' : lang);
    
    // Update theme if needed
    const isDark = document.documentElement.classList.contains('dark');
    monaco.editor.setTheme(isDark ? 'vs-dark' : 'vs');
    
    // Reset content if requested or if empty
    if (resetContent) {
        const currentValue = editor.getValue().trim();
        if (currentValue === '' || confirm('Switching languages will replace current code. Continue?')) {
            editor.setValue(defaultTemplates[lang] || '');
        }
    }
    
    // Show/hide console for JavaScript
    const consolePanel = document.getElementById('consolePanel');
    if (lang === 'javascript') {
        consolePanel.classList.remove('hidden');
    } else {
        consolePanel.classList.add('hidden');
    }
    
    autoSave();
}

function runCode() {
    const code = editor.getValue();
    const previewFrame = document.getElementById('previewFrame');
    const placeholder = document.getElementById('previewPlaceholder');
    const runBtn = document.getElementById('runBtn');
    
    // Add running animation
    runBtn.classList.add('running');
    setTimeout(() => runBtn.classList.remove('running'), 2000);
    
    // Hide placeholder
    placeholder.style.display = 'none';
    
    // Clear previous console
    clearConsole();
    
    // Generate preview content based on language
    let content = '';
    
    switch(currentLanguage) {
        case 'html':
            content = wrapHTMLWithConsoleCapture(code);
            break;
        case 'css':
            content = wrapCSSForPreview(code);
            break;
        case 'javascript':
            content = wrapJavaScriptForPreview(code);
            break;
        case 'markdown':
            content = wrapMarkdownForPreview(code);
            break;
        default:
            content = code;
    }
    
    // Write to iframe
    const blob = new Blob([content], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    previewFrame.src = url;
    
    // Cleanup blob URL after load
    previewFrame.onload = () => {
        URL.revokeObjectURL(url);
    };
    
    autoSave();
}

function wrapHTMLWithConsoleCapture(html) {
    if (!html.includes('<script')) {
        return injectConsoleScript(html);
    }
    
    // Inject console capture before first script tag
    return html.replace(/<script/i, (match) => {
        return `<script>
            // Console capture
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            const originalInfo = console.info;
            
            function sendToParent(type, args) {
                try {
                    window.parent.postMessage({
                        type: 'console',
                        method: type,
                        args: Array.from(args).map(arg => {
                            if (typeof arg === 'object') return JSON.stringify(arg);
                            return String(arg);
                        }),
                        timestamp: new Date().toISOString()
                    }, '*');
                } catch(e) {}
            }
            
            console.log = function() { sendToParent('log', arguments); originalLog.apply(console, arguments); };
            console.error = function() { sendToParent('error', arguments); originalError.apply(console, arguments); };
            console.warn = function() { sendToParent('warn', arguments); originalWarn.apply(console, arguments); };
            console.info = function() { sendToParent('info', arguments); originalInfo.apply(console, arguments); };
            
            window.onerror = function(msg, url, line) {
                console.error('Error: ' + msg + ' at line ' + line);
                return true;
            };
        <\/script><script`;
    });
}

function injectConsoleScript(html) {
    const script = `<script>
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalInfo = console.info;
        
        function sendToParent(type, args) {
            try {
                window.parent.postMessage({
                    type: 'console',
                    method: type,
                    args: Array.from(args).map(arg => {
                        if (typeof arg === 'object') return JSON.stringify(arg);
                        return String(arg);
                    }),
                    timestamp: new Date().toISOString()
                }, '*');
            } catch(e) {}
        }
        
        console.log = function() { sendToParent('log', arguments); originalLog.apply(console, arguments); };
        console.error = function() { sendToParent('error', arguments); originalError.apply(console, arguments); };
        console.warn = function() { sendToParent('warn', arguments); originalWarn.apply(console, arguments); };
        console.info = function() { sendToParent('info', arguments); originalInfo.apply(console, arguments); };
        
        window.onerror = function(msg, url, line) {
            console.error('Error: ' + msg + ' at line ' + line);
            return true;
        };
    <\/script>`;
    
    if (html.includes('</head>')) {
        return html.replace('</head>', script + '</head>');
    } else if (html.includes('<body>')) {
        return html.replace('<body>', '<body>' + script);
    } else {
        return script + html;
    }
}

function setupMessageListener() {
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'console') {
            appendToConsole(event.data.method, event.data.args);
        }
    });
}

function appendToConsole(method, args) {
    const consoleOutput = document.getElementById('consoleOutput');
    const entry = document.createElement('div');
    entry.className = `console-${method} font-mono text-sm py-1`;
    
    const timestamp = new Date().toLocaleTimeString();
    const message = args.join(' ');
    
    entry.innerHTML = `<span class="text-gray-500 text-xs">[${timestamp}]</span> ${escapeHtml(message)}`;
    consoleOutput.appendChild(entry);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
    
    // Remove placeholder if exists
    const placeholder = consoleOutput.querySelector('.italic');
    if (placeholder) placeholder.remove();
}

function clearConsole() {
    const consoleOutput = document.getElementById('consoleOutput');
    consoleOutput.innerHTML = '<div class="text-gray-500 italic">Console is ready...</div>';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function resetCode() {
    if (confirm('Are you sure you want to reset to default template?')) {
        editor.setValue(defaultTemplates[currentLanguage] || '');
        autoSave();
    }
}

function saveSnippet() {
    const code = editor.getValue();
    if (!code.trim()) {
        alert('Cannot save empty snippet!');
        return;
    }
    
    let name = prompt('Enter a name for this snippet:', `Snippet ${new Date().toLocaleDateString()}`);
    if (!name) return;
    
    const snippet = {
        id: Date.now(),
        name: name,
        language: currentLanguage,
        code: code,
        timestamp: new Date().toISOString()
    };
    
    snippets.push(snippet);
    localStorage.setItem('codeEditor_snippets', JSON.stringify(snippets));
    loadSnippets();
    
    // Show success feedback
    const btn = document.getElementById('saveBtn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i data-feather="check" class="w-4 h-4"></i><span>Saved!</span>';
    btn.classList.add('bg-green-600');
    feather.replace();
    
    setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.classList.remove('bg-green-600');
        feather.replace();
    }, 2000);
}

function loadSnippets() {
    const saved = localStorage.getItem('codeEditor_snippets');
    if (saved) {
        try {
            snippets = JSON.parse(saved);
        } catch (e) {
            snippets = [];
        }
    }
    
    const container = document.getElementById('snippetsList');
    
    if (snippets.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-8 text-gray-500 dark:text-gray-400">
                <i data-feather="inbox" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                <p>No saved snippets yet. Write some code and save it!</p>
            </div>
        `;
        feather.replace();
        return;
    }
    
    container.innerHTML = snippets.map(snippet => {
        const date = new Date(snippet.timestamp).toLocaleString();
        const langColors = {
            html: 'text-orange-500',
            css: 'text-blue-500',
            javascript: 'text-yellow-500',
            markdown: 'text-gray-500'
        };
        
        return `
            <div class="snippet-card bg-gray-50 dark:bg-gray-700 rounded-lg p-4 border border-gray-200 dark:border-gray-600 relative group">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-semibold text-gray-900 dark:text-white truncate pr-8">${escapeHtml(snippet.name)}</h3>
                    <button onclick="deleteSnippet(${snippet.id})" class="text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i data-feather="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2 mb-3 text-xs">
                    <span class="font-mono ${langColors[snippet.language] || 'text-gray-500'} uppercase font-bold">${snippet.language}</span>
                    <span class="text-gray-400">•</span>
                    <span class="text-gray-500 dark:text-gray-400">${date}</span>
                </div>
                <button onclick="loadSnippet(${snippet.id})" class="w-full py-2 bg-white dark:bg-gray-600 hover:bg-gray-100 dark:hover:bg-gray-500 border border-gray-300 dark:border-gray-500 rounded text-sm font-medium text-gray-700 dark:text-gray-200 transition-colors">
                    Load Code
                </button>
            </div>
        `;
    }).join('');
    
    feather.replace();
}

function loadSnippet(id) {
    const snippet = snippets.find(s => s.id === id);
    if (snippet) {
        document.getElementById('languageSelect').value = snippet.language;
        changeLanguage(snippet.language, false);
        editor.setValue(snippet.code);
        runCode();
    }
}

function deleteSnippet(id) {
    if (confirm('Delete this snippet?')) {
        snippets = snippets.filter(s => s.id !== id);
        localStorage.setItem('codeEditor_snippets', JSON.stringify(snippets));
        loadSnippets();
    }
}

function downloadCode() {
    const code = editor.getValue();
    const extensions = {
        html: 'html',
        css: 'css',
        javascript: 'js',
        markdown: 'md'
    };
    
    const blob = new Blob([code], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `code-${Date.now()}.${extensions[currentLanguage] || 'txt'}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function openInNewTab() {
    runCode();
    const previewFrame = document.getElementById('previewFrame');
    if (previewFrame.src && previewFrame.src !== 'about:blank') {
        window.open(previewFrame.src, '_blank');
    }
}

function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.classList.contains('dark');
    
    if (isDark) {
        html.classList.remove('dark');
        monaco.editor.setTheme('vs');
    } else {
        html.classList.add('dark');
        monaco.editor.setTheme('vs-dark');
    }
    
    localStorage.setItem('codeEditor_theme', isDark ? 'light' : 'dark');
}

function autoSave() {
    const draft = {
        language: currentLanguage,
        code: editor.getValue(),
        timestamp: new Date().toISOString()
    };
    localStorage.setItem('codeEditor_draft', JSON.stringify(draft));
}

// Load theme preference
const savedTheme = localStorage.getItem('codeEditor_theme');
if (savedTheme === 'dark' && !document.documentElement.classList.contains('dark')) {
    document.documentElement.classList.add('dark');
} else if (savedTheme === 'light' && document.documentElement.classList.contains('dark')) {
    document.documentElement.classList.remove('dark');
}
